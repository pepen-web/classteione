<!DOCTYPE html>
<html lang="id">
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Halaman Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
  <style>
  body {
    font-family: chewy;
    background-color: lightblue;
  }
  .cntr {
    text-align: center;
  }
  hr {
    width: 320px;
    height: 2px;
    background-color: white;
    border-radius: 8px;
  }
  .card {
    background: white;
    border: 2px solid black; 
    border-radius: 8px;
    padding: 15px;
    height: auto;
    width: max-content;
    margin: 0 auto;
  }
  form {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 12px 10px;
    align-items: center;
  }
  .txt {
    border: 2px solid black;
    border-radius: 8px;
    background: pink;
    font-family: chewy;
    padding: 4px 8px;
  }
  .btn {
    border: 2px solid black;
    border-radius: 8px;
    background: pink;
    padding: 8px;
    font-family: chewy;
    height: 35px;
    grid-column: 1 / 3;
    margin-top: 5px;
    cursor: pointer;
  }
  </style> 
</head>
<body> 
  <h1 class="cntr">Selamat Datang</h1> 
  
  <hr><br>
  
  <h3 class="cntr">Silahkan Login Terlebih Dahulu</h3>
  <div class="card">
    <form id="formLogin">
      <label>Username :</label>
      <input type="text" class="txt" id="inputNama" placeholder="Masukan nama kamu" required>
      
      <label>Password :</label>
      <input type="number" class="txt" id="inputPassword" placeholder="Masukan password kamu" required>
      
      <input type="submit" value="Login" class="btn">
    </form>
  </div>
  
  <script>
  const formLogin = document.getElementById("formLogin");
  const daftarAkun = [
  { nama: "pendra", password: "1234", foto: "pendra.jpg" },
  { nama: "fachrudin", password: "1234", foto: "udin.jpg" },
  { nama: "salsabila", password: "1234", foto: "salsa.jpg" },
  { nama: "aldy", password: "1234", foto: "aldy.jpg" },
  { nama: "rehan", password: "1234", foto: "rehan.jpg" },
  { nama: "fadli", password: "1234", foto: "fadli.jpg" }
  ];
  
  formLogin.addEventListener("submit", function(event) {
    event.preventDefault();
    
    const namaUser = document.getElementById("inputNama").value.toLowerCase();
    const passwordUser = document.getElementById("inputPassword").value;
    
    let loginSukses = false;
    let namaUserYangBerhasil = "";
    let fotoUserYangBerhasil = "";
    
    for (let i = 0; i < daftarAkun.length; i++) {
      if (namaUser === daftarAkun[i].nama && passwordUser === daftarAkun[i].password) {
        loginSukses = true;
        namaUserYangBerhasil = document.getElementById("inputNama").value;
        fotoUserYangBerhasil = daftarAkun[i].foto;
        break;
      }
    }
      if (loginSukses === true) {
        localStorage.setItem("namaLogin", namaUserYangBerhasil);
        localStorage.setItem("fotoLogin", fotoUserYangBerhasil);
        
        alert ("Login Berhasil!," + namaUserYangBerhasil);
        window.location.href = "beranda.html";
      } else {
        alert ("Login Gagal! Nama atau Password salah");
      }
  });
  </script>
</body>
</html>
